---
layout: default
---
<div class="with-panel">
  <main id="main-content" class="page" tabindex="-1">
    <header class="page-header">
      <h1 class="page-title">{{ page.title }}</h1>
      {%- if page.description %}
      <p class="page-lead">{{ page.description }}</p>
      {%- endif %}
    </header>
    <div class="prose">
      {{ content }}
    </div>
  </main>
  {% include panel.html %}
</div>
