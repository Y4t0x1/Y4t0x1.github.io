<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a121c"/>
      <stop offset="100%" stop-color="#112235"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular background -->
  <circle cx="60" cy="60" r="58" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="2.5"/>

  <!-- Cyber Hexagon Grid Accent -->
  <polygon points="60,20 88,36 88,68 60,84 32,68 32,36" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5" stroke-dasharray="4 2"/>

  <!-- Stylized Y / Hacker Monogram -->
  <g filter="url(#glow)">
    <!-- Terminal prompt symbol -->
    <path d="M42 46 L54 58 L42 70" fill="none" stroke="url(#accentGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Underscore cursor -->
    <line x1="58" y1="70" x2="78" y2="70" stroke="url(#accentGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Small cyber node dots -->
    <circle cx="60" cy="20" r="2.5" fill="#2dd4bf"/>
    <circle cx="88" cy="68" r="2.5" fill="#38bdf8"/>
    <circle cx="32" cy="68" r="2.5" fill="#2dd4bf"/>
  </g>
</svg>
