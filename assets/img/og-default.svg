<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f16"/>
      <stop offset="100%" stop-color="#111d2e"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56, 189, 248, 0.07)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Glow orb -->
  <circle cx="1000" cy="180" r="300" fill="rgba(45, 212, 191, 0.08)" filter="blur(60px)"/>

  <g transform="translate(100, 140)">
    <rect x="0" y="0" width="180" height="38" rx="19" fill="rgba(45, 212, 191, 0.12)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="1"/>
    <text x="90" y="24" fill="#2dd4bf" font-family="monospace" font-size="16" font-weight="600" text-anchor="middle">y4t0x1@ctf:~$</text>

    <text x="0" y="120" fill="#f2f7fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">
      Breaking boxes,
    </text>
    <text x="0" y="195" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">
      writing it all down.
    </text>

    <text x="0" y="270" fill="#8d9db2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400">
      Cybersecurity writeups, incident reports, DFIR, and penetration testing notes.
    </text>

    <line x1="0" y1="340" x2="1000" y2="340" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>

    <text x="0" y="380" fill="#2dd4bf" font-family="monospace" font-size="18">Web · Forensics · Reversing · Privilege Escalation · Threat Hunting</text>
  </g>
</svg>
